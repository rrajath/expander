name: Release

# Releases are cut by pushing a version tag, never by pushing commits:
#
#   git tag v1.2.3
#   git push origin v1.2.3
#
# That builds a debug APK, a release APK and a release AAB, rolls the
# CHANGELOG "Unreleased" section into a dated "[1.2.3]" section (committed
# back to main), and publishes a GitHub Release with the three artifacts
# attached and the changelog section as the body.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (tag $GITHUB_REF_NAME)"

      # Build from the tagged commit so the artifacts match the tag exactly.
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ENCODED_KEYSTORE" ]; then
            echo "$ENCODED_KEYSTORE" | base64 --decode > "$GITHUB_WORKSPACE/release-keystore.jks"
            echo "Keystore decoded."
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - the release APK and AAB will be unsigned."
          fi

      - name: Build debug APK, release APK and release AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew \
            assembleDebug \
            assembleRelease \
            bundleRelease \
            -PVERSION_NAME="${{ steps.version.outputs.version }}" \
            --stacktrace

      - name: Collect and rename artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist

          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/expander-$VERSION-debug.apk"

          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk \
               "dist/expander-$VERSION-release.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk \
               "dist/expander-$VERSION-release-unsigned.apk"
          fi

          cp app/build/outputs/bundle/release/app-release.aab \
             "dist/expander-$VERSION-release.aab"

          ls -la dist

      # Work on main for the changelog roll so the commit lands on the branch,
      # not on the detached tag checkout.
      - name: Roll CHANGELOG Unreleased section into this version
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 .github/scripts/roll_changelog.py \
            "${{ steps.version.outputs.version }}" "$(date +%Y-%m-%d)"

      - name: Commit CHANGELOG update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: roll CHANGELOG Unreleased into ${GITHUB_REF_NAME}" \
            || echo "CHANGELOG already up to date, nothing to commit."
          git push origin main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: expander-${{ steps.version.outputs.version }}
          path: dist/*
          retention-days: 90
